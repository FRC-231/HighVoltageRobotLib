name: Build and Publish

on:
  push:
    branches: [ master, '2026' ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu produces linuxx86-64 AND cross-compiles linuxathena.
          - os: ubuntu-latest
            name: linux
          # Windows binaries cannot be cross-compiled from Linux, which is the
          # only reason this second runner exists. Students run the desktop
          # simulator on Windows.
          # windows-2022, not windows-latest: the newer MSVC on windows-latest
          # rejects WPILib 2026.2.1's wpimath geometry headers with
          # "error C3615: constexpr function cannot result in a constant
          # expression". That is a WPILib/MSVC version incompatibility, not
          # something this build controls. Revisit when WPILib supports it.
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install roboRIO toolchain
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew installRoboRioToolchain

      # "check", not "test": test is a Java-plugin task and this project has
      # no java plugin. Native GoogleTest suites run under check.
      - name: Build, test and publish to a local maven tree
        run: ./gradlew build check publish -PreleaseMode

      - uses: actions/upload-artifact@v4
        with:
          name: maven-${{ matrix.name }}
          path: build/repos/releases

      # The vendordep json is platform-independent, so only one runner uploads it.
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vendordep-json
          path: build/repos/*.json

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      # The two runners produce disjoint files - different platform
      # classifiers - so merging is a plain copy. Headers, sources and the
      # .pom are byte-identical from both, so last-writer-wins is correct.
      - name: Merge maven trees
        run: |
          mkdir -p pages/repo
          for d in downloaded/maven-*; do
            cp -r "$d/." pages/repo/
          done

      - name: Publish the vendordep json at the repo root
        run: cp downloaded/vendordep-json/*.json pages/

      - name: Commit
        working-directory: pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git push
