name: Build and Publish

on:
  push:
    branches: [ master, '2026' ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu produces linuxx86-64 AND cross-compiles linuxathena.
          # That is every platform this library ships.
          #
          # There is deliberately no Windows job. Students build on Windows
          # but only ever CROSS-COMPILE for the roboRIO, which uses the ARM
          # GCC toolchain, not MSVC, so no Windows binary of this library is
          # ever linked. Simulation runs on Ubuntu only.
          #
          # This also sidesteps a real blocker: MSVC rejects WPILib 2026.2.1's
          # wpimath geometry headers with "error C3615: constexpr function
          # cannot result in a constant expression" (reproduced on both
          # windows-latest and windows-2022). If a Windows desktop build is
          # ever needed, that must be solved first.
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install roboRIO toolchain
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew installRoboRioToolchain

      # "check", not "test": test is a Java-plugin task and this project has
      # no java plugin. Native GoogleTest suites run under check.
      - name: Build, test and publish to a local maven tree
        run: ./gradlew build check publish -PreleaseMode

      - uses: actions/upload-artifact@v4
        with:
          name: maven-${{ matrix.name }}
          path: build/repos/releases

      # The vendordep json is platform-independent, so only one runner uploads it.
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vendordep-json
          path: build/repos/*.json

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      # The two runners produce disjoint files - different platform
      # classifiers - so merging is a plain copy. Headers, sources and the
      # .pom are byte-identical from both, so last-writer-wins is correct.
      - name: Merge maven trees
        run: |
          mkdir -p pages/repo
          for d in downloaded/maven-*; do
            cp -r "$d/." pages/repo/
          done

      - name: Publish the vendordep json at the repo root
        run: cp downloaded/vendordep-json/*.json pages/

      - name: Commit
        working-directory: pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git push
