import edu.wpi.first.toolchain.*
import org.gradle.nativeplatform.toolchain.VisualCpp

plugins {
    id 'cpp'
    id 'google-test'
    id 'edu.wpi.first.wpilib.repositories.WPILibRepositoriesPlugin' version '2025.0'
    id 'edu.wpi.first.NativeUtils' version '2026.0.1'
    id 'edu.wpi.first.GradleVsCode' version '2.1.0'
}

// Pinned to the version GradleRIO 2026.2.1 resolves in FRC231_2026, so the
// library is compiled against exactly what the robot links against.
ext.wpilibVersion = "2026.2.1"

// Pinned, not a range: this library is compiled against Phoenix6's headers, and
// CTRE breaks its API every January. Consumers must install a Phoenix6
// vendordep of the same major version - see README.
ext.phoenix6Version = "26.1.1"

repositories {
    mavenCentral()
    maven {
        name = 'ctre'
        url = 'https://maven.ctr-electronics.com/release/'
    }
}
if (project.hasProperty('releaseMode')) {
    wpilibRepositories.addAllReleaseRepositories(project)
} else {
    wpilibRepositories.addAllDevelopmentRepositories(project)
}

apply from: 'config.gradle'

// Phoenix6 appears in this library's PUBLIC headers (MK4SwerveModule.h,
// MK5NSwerveModule.h, CommonConfig.h), so we need its headers to compile.
// We deliberately do NOT link its binaries: this is a static library, so
// unresolved CTRE symbols are fine here and get resolved at the consumer's
// link step by their own Phoenix6 vendordep. That keeps us off CTRE's
// per-platform binary matrix entirely.
configurations {
    phoenix6Headers
}

dependencies {
    phoenix6Headers "com.ctre.phoenix6:wpiapi-cpp:${phoenix6Version}:headers@zip"
    phoenix6Headers "com.ctre.phoenix6:api-cpp:${phoenix6Version}:headers@zip"
    phoenix6Headers "com.ctre.phoenix6:tools:${phoenix6Version}:headers@zip"
}

def phoenix6HeaderDir = layout.buildDirectory.dir("phoenix6-headers")

task extractPhoenix6Headers(type: Sync) {
    description = 'Unpacks the Phoenix6 header zips so the compiler can see them.'
    group = 'Build'
    duplicatesStrategy = 'exclude'  // the three zips each carry CTRE_LICENSE.txt
    from { configurations.phoenix6Headers.collect { zipTree(it) } }
    into phoenix6HeaderDir
}

// Desktop AND athena Phoenix6 binaries, needed ONLY to link the test
// executables. The published library itself never links these - it ships with
// unresolved CTRE symbols that a consumer's own vendordep resolves.
//
// Every platform we build needs an entry: `gradle build` links a test exe per
// platform, including athena, even though the ARM one can never be run here.
// Maps our platform name -> the directory layout inside CTRE's zips.
ext.phoenix6Platforms = [
    'linuxathena'  : 'linux/athena',
    'linuxx86-64'  : 'linux/x86-64',
    'windowsx86-64': 'windows/x86-64',
]

ext.phoenix6LibDirFor = { platformName ->
    file("${buildDir}/phoenix6-libs/${platformName}/${phoenix6Platforms[platformName]}/shared")
}

phoenix6Platforms.each { platformName, _subdir ->
    def safe = platformName.replace('-', '_')
    def cfgName = "phoenix6Libs_${safe}"
    configurations.create(cfgName)
    ['wpiapi-cpp', 'api-cpp', 'tools'].each { artifact ->
        dependencies.add(cfgName, "com.ctre.phoenix6:${artifact}:${phoenix6Version}:${platformName}@zip")
    }
    tasks.register("extractPhoenix6Libs_${safe}", Sync) {
        description = "Unpacks Phoenix6 ${platformName} binaries for test linking."
        group = 'Build'
        duplicatesStrategy = 'exclude'
        from { configurations.getByName(cfgName).collect { zipTree(it) } }
        into layout.buildDirectory.dir("phoenix6-libs/${platformName}")
    }
}


// MSVC and GCC disagree on every flag below, so both are spelled out.
ext.addPhoenix6Headers = { binary ->
    def dir = phoenix6HeaderDir.get().asFile
    if (binary.toolChain in VisualCpp) {
        // MSVC has no -isystem. /external:I needs /experimental:external on
        // older toolsets, and the GCC-15 fmt/units diagnostic that forced
        // -isystem on Linux does not occur here, so a plain include path is
        // enough.
        binary.cppCompiler.args "/I${dir}"
    } else {
        // -isystem, not -I. The build runs -nostdinc -Wall -Wextra -pedantic,
        // and GCC only suppresses diagnostics from headers it considers
        // "system" ones. Phoenix6's headers instantiate wpiutil's fmt/units
        // templates in ways that trip -fpermissive under GCC 15; as -I that is
        // a hard compile error. -isystem is also exactly how a consuming robot
        // project receives them from its vendordep.
        binary.cppCompiler.args "-isystem", "${dir}"
    }
}

ext.addPhoenix6TestLibs = { binary ->
    def platformName = binary.targetPlatform.name
    if (!phoenix6Platforms.containsKey(platformName)) {
        return
    }
    def dir = phoenix6LibDirFor(platformName)
    if (binary.toolChain in VisualCpp) {
        binary.linker.args "/LIBPATH:${dir}", "CTRE_Phoenix6_WPI.lib", "CTRE_PhoenixTools.lib"
    } else {
        binary.linker.args "-L${dir}", "-Wl,-rpath,${dir}",
                           "-lCTRE_Phoenix6_WPI", "-lCTRE_PhoenixTools"
    }
}

nativeUtils {
    exportsConfigs {
        HighVoltageRobotLib {
        }
    }
}

model {
    components {
        HighVoltageRobotLib(NativeLibrarySpec) {
            sources {
                cpp {
                    source {
                        srcDirs 'src/main/native/cpp'
                        include '**/*.cpp'
                    }
                    exportedHeaders {
                        srcDirs 'src/main/native/include',
                                'third_party/nlohmann'
                    }
                }
            }
            binaries.all {
                addPhoenix6Headers(it)
            }
            nativeUtils.useRequiredLibrary(it, 'wpilib_shared')
        }
    }
    testSuites {
        HighVoltageRobotLibTest {
            sources.cpp {
                source {
                    srcDir 'src/test/native/cpp'
                    include '**/*.cpp'
                }
            }
            binaries.all {
                // Release only. CTRE ships a single build of
                // libCTRE_Phoenix6_WPI.so whose NEEDED entries name the
                // RELEASE WPILib sonames (libwpilibc.so, not libwpilibcd.so).
                // A debug test binary is staged with the debug WPILib
                // libraries, so CTRE's library can never resolve and the exe
                // dies at startup with "libwpilibc.so: cannot open shared
                // object file". Nothing we pass to the linker fixes that - it
                // is how CTRE distributes Phoenix6 - so debug test binaries
                // are simply not built. The library itself still builds in
                // both debug and release; only its tests are release-only.
                if (it.buildType.name == 'debug')
                {
                    it.buildable = false
                    return
                }
                addPhoenix6Headers(it)
                // The test exe links the whole static library, which carries
                // unresolved CTRE symbols by design, so the tests - and only
                // the tests - need real Phoenix6 binaries.
                addPhoenix6TestLibs(it)
            }
            nativeUtils.useRequiredLibrary(it, 'wpilib_executable_shared', 'googletest_static')
        }
    }
}

// Wired outside model {} on purpose: the software model creates the CppCompile
// tasks lazily, and referencing extractPhoenix6Headers from inside a model rule
// fails to resolve.
tasks.withType(CppCompile).configureEach {
    dependsOn extractPhoenix6Headers
}

tasks.withType(LinkExecutable).configureEach {
    phoenix6Platforms.keySet().each { platformName ->
        dependsOn "extractPhoenix6Libs_${platformName.replace('-', '_')}"
    }
}

apply from: 'publish.gradle'

wrapper {
    gradleVersion = '8.14.3'
}
